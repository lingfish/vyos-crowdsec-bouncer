# crowdsec-custom-bouncer configuration
# Docs: https://docs.crowdsec.net/u/bouncers/custom
# Env vars are expanded by the official image entrypoint.

# Absolute path to the script that receives decisions.
bin_path: /opt/vyos-crowdsec-bouncer/vyos-bouncer.sh

bin_args: []
# Invoke the script once per decision with args (add/del ...) rather than a
# long-lived stdin process. We batch inside the script instead.
feed_via_stdin: false
total_retries: 0

# Only handle IP and Range scope decisions.
scopes: ["Ip", "Range"]
scenarios_containing: []
scenarios_not_containing: []
origins: []

piddir: /var/run/
update_frequency: 10s
cache_retention_duration: 10s

# Run in the foreground and log to stdout so podman captures everything.
daemonize: false
log_mode: stdout
log_level: info

api_url: ${CROWDSEC_LAPI_URL}
api_key: ${API_KEY}

prometheus:
  enabled: true
  listen_addr: 0.0.0.0
  listen_port: 60602