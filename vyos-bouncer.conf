# vyos-bouncer configuration
# Mounted into the container at /etc/crowdsec/vyos-bouncer.conf (chmod 600).
# Each value only takes effect if it is not already set in the environment,
# so per-invocation env-var overrides win over this file.

# CrowdSec Local API. The container uses allow-host-networks and reaches
# LAPI outbound. HTTPS with a self-signed cert is fine (curl -k).
[ -z "${LAPI_URL:-}" ] && LAPI_URL="https://lapi.example.com:8080"
[ -z "${API_KEY:-}" ] && API_KEY="CHANGE_ME"

# Decision scopes to mirror into the served list (comma-separated).
[ -z "${SCOPES:-}" ] && SCOPES="Ip,Range"

# Skip decisions produced in simulation mode.
[ -z "${SKIP_SIMULATED:-}" ] && SKIP_SIMULATED="true"

# Where the newline-delimited ban list is written. busybox httpd serves this
# file to VyOS, which polls it as a firewall remote-group.
[ -z "${BANS_FILE:-}" ] && BANS_FILE="/www/bans.txt"

# Refresh loop cadence (seconds) and HTTP server bind address/port.
# HTTP_BIND must stay on loopback: the container uses host networking and the
# VyOS resolver fetches the list from 127.0.0.1.
[ -z "${REFRESH_SECONDS:-}" ] && REFRESH_SECONDS="5"
[ -z "${HTTP_BIND:-}" ] && HTTP_BIND="127.0.0.1"
[ -z "${HTTP_PORT:-}" ] && HTTP_PORT="8080"