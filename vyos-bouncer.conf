# vyos-bouncer configuration
# Mounted into the container at /etc/crowdsec/vyos-bouncer.conf (chmod 600).
# Values here can be overridden per-invocation via environment variables.

# VyOS HTTPS API (REST). The bouncer container uses allow-host-networks and
# talks to the loopback listener. Keep it bound to 127.0.0.1 on VyOS.
VYOS_API_URL="https://127.0.0.1"
VYOS_API_KEY="CHANGE_ME"

# Firewall group names referenced by your VyOS firewall rules.
ADDRESS_GROUP_V4="CROWDSEC-BANNED"
ADDRESS_GROUP_V6="CROWDSEC-BANNED-V6"
NETWORK_GROUP_V4="CROWDSEC-BANNED-NET"
NETWORK_GROUP_V6="CROWDSEC-BANNED-NET-V6"

# Batching: quiet window (seconds) before flushing, and max polling rounds.
# One VyOS config commit happens per flush.
BATCH_WINDOW="3"
BATCH_MAX_ROUNDS="10"

# API behavior
API_TIMEOUT="30"
API_RETRIES="3"
API_RETRY_DELAY="2"

# Where pending ops are spooled while batching.
SPOOL_DIR="/var/spool/crowdsec"